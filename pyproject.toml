[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rapidctl"
dynamic = ["version"]
description = "A Python framework for creating custom CLI tools using Podman"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "podman",
    "mcp<2",
    "kubernetes",
    "rich",
    "pydantic",
]

[project.optional-dependencies]
docker = ["docker>=7.2.0,<8"]

[tool.hatch.version]
source = "vcs"

[project.urls]
Homepage = "https://github.com/dalethestirling/rapidctl"

[tool.pytest.ini_options]
markers = [
    "requires_podman: mark test as requiring a running Podman service",
    "requires_docker: mark test as requiring a running Docker daemon",
]
